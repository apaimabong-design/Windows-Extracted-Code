name: Docker Escape
on: [push, workflow_dispatch]
jobs:
  escape:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== USER ==="
          id
          
          echo "=== DOCKER INFO ==="
          docker info | head -20
          
          echo "=== TRY PRIVILEGED CONTAINER ==="
          docker run --privileged --rm alpine cat /etc/hostname
          
          echo "=== CHECK HOST MOUNTS ==="
          docker run --privileged --rm alpine cat /proc/1/cgroup
