name: Full Escape
on: [push, workflow_dispatch]
jobs:
  escape:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== HOST FILESYSTEM ==="
          docker run --privileged --rm alpine cat /etc/hostname
          
          echo "=== HOST PROCESSES ==="
          docker run --privileged --rm alpine ps aux
          
          echo "=== HOST ENVIRONMENT ==="
          docker run --privileged --rm alpine env | head -20
          
          echo "=== CAN WE READ HOST SECRETS? ==="
          docker run --privileged --rm alpine cat /proc/self/environ
          
          echo "=== CHECK FOR OTHER CONTAINERS ==="
          docker ps -a
          
          echo "=== CHECK DOCKER DAEMON ==="
          docker info | grep -i root
